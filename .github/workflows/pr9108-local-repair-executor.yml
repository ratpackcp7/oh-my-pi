name: PR 9108 local repair executor

on:
  push:
    branches: [main]
    paths: [.github/workflows/pr9108-local-repair-executor.yml]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pr9108-review-findings
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Apply exact review fixes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one anchor, found {count}")
              p.write_text(text.replace(old, new, 1))

          replace_exact(
              "packages/coding-agent/src/config/settings-schema.ts",
              '\t"task.routing.enabled": {\n\t\ttype: "boolean",\n\t\tdefault: true,',
              '\t"task.routing.enabled": {\n\t\ttype: "boolean",\n\t\tdefault: false,',
          )

          replace_exact(
              "packages/coding-agent/src/task/index.ts",
              '''\t\tconst siblingPoolKeysForBatch: string[] = [...this.#siblingPoolKeys];\n\t\tconst preflightResults: Array<{ policy?: EffectiveSubagentPolicy; error?: string }> = [];''',
              '''\t\tconst siblingPoolKeysForBatch: string[] = [...this.#siblingPoolKeys];\n\t\tconst selectedPoolKeysForBatch: string[] = [];\n\t\tconst preflightResults: Array<{ policy?: EffectiveSubagentPolicy; error?: string }> = [];''',
          )
          replace_exact(
              "packages/coding-agent/src/task/index.ts",
              '''\t\t\t\tif (poolKey) {\n\t\t\t\t\tsiblingPoolKeysForBatch.push(poolKey);\n\t\t\t\t\tthis.#siblingPoolKeys.push(poolKey);\n\t\t\t\t\tif (this.#siblingPoolKeys.length > 20) this.#siblingPoolKeys.shift();\n\t\t\t\t}''',
              '''\t\t\t\tif (poolKey) {\n\t\t\t\t\tsiblingPoolKeysForBatch.push(poolKey);\n\t\t\t\t\tselectedPoolKeysForBatch.push(poolKey);\n\t\t\t\t}''',
          )
          replace_exact(
              "packages/coding-agent/src/task/index.ts",
              '''\t\t}\n\t\tconst policies = preflights.map(preflight => preflight.policy!);''',
              '''\t\t}\n\t\tfor (const poolKey of selectedPoolKeysForBatch) {\n\t\t\tthis.#siblingPoolKeys.push(poolKey);\n\t\t\tif (this.#siblingPoolKeys.length > 20) this.#siblingPoolKeys.shift();\n\t\t}\n\t\tconst policies = preflights.map(preflight => preflight.policy!);''',
          )

          replace_exact(
              "packages/coding-agent/src/task/executor.ts",
              'import { subprocessToolRegistry } from "./subprocess-tool-registry";\n',
              '''import { subprocessToolRegistry } from "./subprocess-tool-registry";\nimport {\n\tappendLedgerEntry,\n\tgetOmpVersion,\n\tledgerPathForSession,\n\tprogressToLedgerEntry,\n\tshouldAppendLedgerEntry,\n\ttype LedgerEntry,\n} from "./subagent-ledger";\n''',
          )
          replace_exact(
              "packages/coding-agent/src/task/executor.ts",
              '\tlet lastLedgerEntry: import("./subagent-ledger").LedgerEntry | undefined;',
              '\tlet lastLedgerEntry: LedgerEntry | undefined;',
          )
          replace_exact(
              "packages/coding-agent/src/task/executor.ts",
              '''\t\tif (args.sessionFile) {\n\t\t\tconst snapshot = { ...progress } as typeof progress;\n\t\t\tvoid (async () => {\n\t\t\t\ttry {\n\t\t\t\t\tconst { progressToLedgerEntry, ledgerPathForSession, appendLedgerEntry, shouldAppendLedgerEntry } = await import("./subagent-ledger");\n\t\t\t\t\tconst entry = progressToLedgerEntry(snapshot);\n\t\t\t\t\tif (shouldAppendLedgerEntry(lastLedgerEntry, entry)) {\n\t\t\t\t\t\tawait appendLedgerEntry(ledgerPathForSession(args.sessionFile as string), entry);\n\t\t\t\t\t\tlastLedgerEntry = entry;\n\t\t\t\t\t}\n\t\t\t\t} catch {}\n\t\t\t})();\n\t\t}''',
              '''\t\tif (args.sessionFile) {\n\t\t\tconst snapshot = { ...progress } as typeof progress;\n\t\t\tvoid (async () => {\n\t\t\t\ttry {\n\t\t\t\t\tconst entry = progressToLedgerEntry(snapshot);\n\t\t\t\t\tif (shouldAppendLedgerEntry(lastLedgerEntry, entry)) {\n\t\t\t\t\t\tawait appendLedgerEntry(ledgerPathForSession(args.sessionFile as string), entry);\n\t\t\t\t\t\tlastLedgerEntry = entry;\n\t\t\t\t\t}\n\t\t\t\t} catch (error) {\n\t\t\t\t\tlogger.debug("Subagent ledger append failed", { error, id, sessionFile: args.sessionFile });\n\t\t\t\t}\n\t\t\t})();\n\t\t}''',
          )

          replace_exact(
              "packages/coding-agent/src/task/executor.ts",
              '''\t\t\tconst inheritedRetryFallbackChain =\n\t\t\t\tconfiguredModelPatterns.length === 1''',
              '''\t\t\tconst selectedResolution = resolveModelOverride(modelPatterns, modelRegistry, settings);\n\t\t\tconst inheritedRetryFallbackChain =\n\t\t\t\tconfiguredModelPatterns.length === 1''',
          )
          replace_exact(
              "packages/coding-agent/src/task/executor.ts",
              '''\t\t\tconst spawnEffortCeiling = options.effort !== undefined ? settings.get("task.maxEffort") : undefined;\n\t\t\tconst effortLevel =\n\t\t\t\toptions.effort !== undefined\n\t\t\t\t\t? resolveTaskEffortLevel(model, options.effort, spawnEffortCeiling)\n\t\t\t\t\t: undefined;\n\t\t\tif (model) {''',
              '''\t\t\tconst spawnEffortCeiling = options.effort !== undefined ? settings.get("task.maxEffort") : undefined;\n\t\t\tconst effortLevel =\n\t\t\t\toptions.effort !== undefined\n\t\t\t\t\t? resolveTaskEffortLevel(model, options.effort, spawnEffortCeiling)\n\t\t\t\t\t: undefined;\n\t\t\tif (selectedResolution.model) {\n\t\t\t\tconst selectedEffortLevel =\n\t\t\t\t\toptions.effort !== undefined\n\t\t\t\t\t\t? resolveTaskEffortLevel(selectedResolution.model, options.effort, spawnEffortCeiling)\n\t\t\t\t\t\t: undefined;\n\t\t\t\tconst selectedDisplayLevel =\n\t\t\t\t\tselectedEffortLevel ??\n\t\t\t\t\t(selectedResolution.explicitThinkingLevel ? selectedResolution.thinkingLevel : undefined);\n\t\t\t\tprogress.selectedModel =\n\t\t\t\t\tselectedDisplayLevel !== undefined\n\t\t\t\t\t\t? formatModelSelectorValue(formatModelStringWithRouting(selectedResolution.model), selectedDisplayLevel)\n\t\t\t\t\t\t: formatModelStringWithRouting(selectedResolution.model);\n\t\t\t}\n\t\t\tif (model) {''',
          )
          replace_exact(
              "packages/coding-agent/src/task/executor.ts",
              '''\t\t\t\t// Preserve selected before any runtime fallback\n\t\t\t\tif (!progress.selectedModel) progress.selectedModel = progress.resolvedModel;\n\t\t\t\tprogress.parentModel = options.parentActiveModelPattern;\n\t\t\t\ttry {\n\t\t\t\t\tconst { getOmpVersion } = await import("./subagent-ledger");\n\t\t\t\t\tprogress.ompVersion = getOmpVersion();\n\t\t\t\t} catch {\n\t\t\t\t\tprogress.ompVersion = "unknown";\n\t\t\t\t}''',
              '''\t\t\t\tprogress.selectedModel ??= progress.resolvedModel;\n\t\t\t\tprogress.parentModel = options.parentActiveModelPattern;\n\t\t\t\tprogress.ompVersion = getOmpVersion();''',
          )

          Path("packages/coding-agent/test/pr9108-review-regressions.test.ts").write_text(r'''import { describe, expect, it } from "bun:test";
          import { SETTINGS_SCHEMA } from "@oh-my-pi/pi-coding-agent/config/settings-schema";

          const root = new URL("../src/", import.meta.url);
          const readSource = async (relative: string) => Bun.file(new URL(relative, root)).text();

          describe("PR #9108 upstream review regressions", () => {
            it("keeps dynamic task routing opt-in by default", () => {
              expect(SETTINGS_SCHEMA["task.routing.enabled"].default).toBe(false);
            });

            it("keeps routing snapshot off provider usage/network probes", async () => {
              const source = await readSource("task/routing/snapshot.ts");
              expect(source).not.toContain("getModelUsageHealth(");
              expect(source).toContain('usage: "unknown"');
            });

            it("keeps the ledger out of transcript discovery and dynamic imports", async () => {
              const ledger = await readSource("task/subagent-ledger.ts");
              const executor = await readSource("task/executor.ts");
              expect(ledger).toContain(".ledger.ndjson");
              expect(ledger).not.toContain(".ledger.jsonl");
              expect(executor).not.toContain('await import("./subagent-ledger")');
              expect(executor).not.toContain('import("./subagent-ledger").LedgerEntry');
              expect(executor).toContain('logger.debug("Subagent ledger append failed"');
            });

            it("captures the selected route before auth fallback", async () => {
              const source = await readSource("task/executor.ts");
              const selected = source.indexOf("const selectedResolution = resolveModelOverride(");
              const fallback = source.indexOf("resolveModelOverrideWithAuthFallback(");
              expect(selected).toBeGreaterThan(-1);
              expect(fallback).toBeGreaterThan(-1);
              expect(selected).toBeLessThan(fallback);
              expect(source).toContain("selectedResolution.explicitThinkingLevel");
            });

            it("commits persistent sibling history only after the failure gate", async () => {
              const source = await readSource("task/index.ts");
              const failureGate = source.indexOf("if (preflightFailures.length > 0)");
              const persistentMutation = source.indexOf("this.#siblingPoolKeys.push(poolKey)", failureGate);
              expect(failureGate).toBeGreaterThan(-1);
              expect(persistentMutation).toBeGreaterThan(failureGate);
            });
          });
          '''.replace(/^          /gm, ""))
          PY

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run targeted failure/regression tests
        run: |
          bun test \
            packages/coding-agent/test/pr9108-review-regressions.test.ts \
            packages/coding-agent/test/runtime-model-identity.test.ts \
            packages/coding-agent/test/task-routing-integration.test.ts

      - name: Run TypeScript checks
        run: bun run check:ts

      - name: Commit repaired fix branch
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/pr9108-one-shot-repair.yml
          git config user.name "cp7-local-repair"
          git config user.email "actions@users.noreply.github.com"
          git add packages/coding-agent/src/config/settings-schema.ts \
                  packages/coding-agent/src/task/index.ts \
                  packages/coding-agent/src/task/executor.ts \
                  packages/coding-agent/test/pr9108-review-regressions.test.ts \
                  .github/workflows/pr9108-one-shot-repair.yml
          git diff --cached --check
          git commit -m "fix(task): address PR 9108 review blockers"
          git push origin HEAD:fix/pr9108-review-findings
