# ship(1) config for this fork. PR repo. /home/chris/projects/oh-my-pi is the serving checkout:
# the omp CLI and the omp-auth-broker user unit run from it (bun, no build step).
CP7_SHIP_MODE=pr
CP7_DEPLOY_WORKFLOW=''
CP7_SHIP_GO_LIVE_COMMAND='ship-restart-unit --checkout /home/chris/projects/oh-my-pi --unit omp-auth-broker --user --sha {sha} --idle "auth-broker serve"'
CP7_HEALTH_COMMAND='curl -fsS -m 10 -o /dev/null -H "Authorization: Bearer $(cat /home/chris/.omp/auth-broker.token)" http://127.0.0.1:8765/v1/usage'
CP7_LIVE_SHA_COMMAND='git -C /home/chris/projects/oh-my-pi rev-parse HEAD'
# Native addons copied in to run tests, and generated views: gitignored, safe to delete before cleanup.
CP7_SHIP_DISPOSABLE='packages/natives/native packages/coding-agent/src/export/html/tool-views.generated.js'
